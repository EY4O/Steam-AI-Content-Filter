[plugin]
id = "ai-content-filter"
name = "AI Content Filter"
version = "1.0.0"
author = "sanscura"
description = "Hide, blur or flag Steam store games that carry an AI Generated Content Disclosure."

[assets]
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
# "auto" installs straight into the local Millennium plugins folder.
# A literal path keeps builds inside the project until you choose to install.
output_path = "dist"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix  = "BCK"
frontend_prefix = "FRT"
webview_prefix  = "WEB"

[patches]
debug = false
